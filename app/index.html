<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在打开吱吱屋</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #faf8f5;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 2px 20px rgba(90, 74, 34, 0.06);
    }
    .logo { font-size: 34px; font-weight: 700; color: #5a7048; letter-spacing: 3px; }
    .slogan { font-size: 14px; color: #9E3B2E; margin-top: 12px; letter-spacing: 1px; }
    .line { width: 48px; height: 1px; background: #e8e0ce; margin: 28px auto; }
    .hint { font-size: 15px; color: #6d5c44; line-height: 1.9; }
    .btn {
      display: inline-block; margin-top: 28px; background: #5a7048; color: #fff;
      text-decoration: none; font-size: 15px; padding: 12px 34px; border-radius: 999px;
    }
    .foot { margin-top: 30px; font-size: 12px; color: #a89880; line-height: 1.9; }
    .foot a { color: #a89880; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">吱吱屋</div>
    <div class="slogan">一屏看世界，一物载乡荣</div>
    <div class="line"></div>
    <div class="hint">
      正在打开吱吱屋…<br />
      如果没有自动跳转，说明这台设备还没有安装。
    </div>
    <a class="btn" href="https://apps.apple.com/cn/app/id6790077672">前往 App Store 下载</a>
    <div class="foot">
      广州吱吱和房科技有限公司<br />
      <a href="https://zhizhiverse.com">zhizhiverse.com</a>
    </div>
  </div>
</body>
</html>
